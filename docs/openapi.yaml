          "type": "string"
          "description": "\"replace\" only: the item that was taken out."
        "addressType":
          "type": "string"
          "enum":
            - "shipping"
            - "billing"
          "description": "\"address\" only: which address changed."
        "reason":
          "type": "string"
        "at":
          "type": "string"
        "by":
