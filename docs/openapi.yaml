            - "type"
            - "value"
          "nullable": true
          "description": "Order discount; null = none."
        "deliveryDate":
          "type": "string"
          "nullable": true
          "description": "YYYY-MM-DD; null = none."
        "shipping":
          "type": "number"
          "description": "Shipping charge and label (for \"shipping\")."
        "shippingLabel":
          "type": "string"
        "address":
          "type": "string"
          "description": "One-line address (for \"address\")."
        "orderTotal":
          "type": "number"
      "required":
        - "orderTotal"
    "OrderCoupon":
