      "description": "Permission: order_items.edit or order_discounts.edit or order_addresses.edit or orders_edit.edit. Edits an existing order (adjust / add / remove / replace an item, order discount, delivery date): validates against the order's status, recalculates with the order's own tax basis, records the change in `adjustments` and keeps catalog products unchanged. Check the permission for the kind of edit: add and remove need order_items.edit, discount order_discounts.edit, address order_addresses.edit, delivery date and shipping orders_edit.edit. Recalculates with the order's own tax basis; never changes the catalog."
