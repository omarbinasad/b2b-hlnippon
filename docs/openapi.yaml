    "QuantityRule":
      "description": "The product's own order limits, counted in PACKAGES (bags, cases, cartons), never in weight. Precedence (resolveQuantityLimits in src/lib/pricing/engine.ts): a quantity rule for the option or the product overrides them; these beat a category or store-wide rule (a minimum of 1 counts as \"not set\"); whatever is still empty comes from the rule, then the default (at least 1, no maximum). The step always comes from here."
      "type": "object"
      "properties":
        "min":
          "type": "number"
          "description": "Minimum packages per order line. At least 1."
        "max":
          "type": "number"
          "description": "Maximum packages per order line. Empty = no limit."
        "step":
          "type": "number"
          "description": "Order in multiples of this many packages. 1 = any whole number (the normal case)."
      "required":
        - "min"
        - "step"
