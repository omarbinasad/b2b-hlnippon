                - "discount"
            "discount":
              "type": "object"
              "properties":
                "type":
                  "type": "string"
                  "enum":
                    - "percent"
                    - "fixed"
                "value":
                  "type": "number"
                  "description": "Store-currency amount for \"fixed\"; a percentage (above 0, at most 100, up to 2 decimals) for \"percent\"."
              "required":
                - "type"
                - "value"
