  "/products":
    "get":
      "operationId": "products_list"
      "tags":
        - "Products and inventory"
      "summary": "products.list"
      "description": "Permission: public. Public catalog: published + visible products only, never prices. Sortable by name or updated. Never includes customer prices."
      "parameters":
        - "name": "categorySlug"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "description": "Includes products in subcategories."
        - "name": "categorySlugs"
          "in": "query"
          "required": false
          "schema":
            "type": "array"
            "items":
              "type": "string"
            "description": "Limit to products in ANY of these categories (subcategories included); combined with `categorySlug` (AND)."
        - "name": "brandSlugs"
          "in": "query"
          "required": false
          "schema":
            "type": "array"
            "items":
              "type": "string"
            "description": "Products carrying ANY of these brands."
        - "name": "productIds"
          "in": "query"
          "required": false
          "schema":
            "type": "array"
            "items":
              "type": "string"
            "description": "Restrict to these product ids (e.g. the result of a customer price-range lookup)."
        - "name": "stockStatus"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "enum":
              - "low_stock"
              - "in_stock"
              - "out_of_stock"
              - "backorder"
        - "name": "featured"
          "in": "query"
          "required": false
          "schema":
            "type": "boolean"
            "description": "Only products flagged as featured."
        - "name": "search"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
        - "name": "sort"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "enum":
              - "name"
              - "updated"
              - "sku"
              - "stock"
              - "price"
        - "name": "dir"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "enum":
              - "asc"
              - "desc"
        - "name": "page"
          "in": "query"
          "required": false
          "schema":
            "type": "number"
            "description": "1-based page number."
        - "name": "perPage"
          "in": "query"
          "required": false
          "schema":
            "type": "number"
      "responses":
        "200":
          "description": "OK"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "items":
                    "type": "array"
                    "items":
                      "$ref": "#/components/schemas/ProductSummary"
                  "page":
                    "type": "number"
                  "perPage":
                    "type": "number"
                  "total":
                    "type": "number"
                  "totalPages":
                    "type": "number"
                "required":
                  - "items"
                  - "page"
                  - "perPage"
                  - "total"
                  - "totalPages"
