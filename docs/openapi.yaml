      "description": "Permission: products.edit. Admin bulk change (src/lib/catalog/bulk.ts). `apply: false` only previews; `apply: true` changes the rows without a problem and skips the rest. At most BULK_LIMIT ids. Body: ids (at most 200), operation, apply. apply false previews; true changes rows without a problem and skips the rest, in one transaction per product. Archiving and deleting need products.delete. Deleting is refused for products that orders, quotations or carts still reference. Same rules as src/lib/catalog/bulk.ts."
