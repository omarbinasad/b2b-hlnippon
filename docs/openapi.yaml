        "variationId":
          "type": "string"
        "name":
          "type": "string"
        "sku":
          "type": "string"
        "attributes":
          "type": "object"
          "additionalProperties":
            "type": "string"
          "description": "Selected variation options, e.g. { Size: \"20 kg\" }."
